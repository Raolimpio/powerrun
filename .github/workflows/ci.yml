name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Lint e verificação de tipos
  lint:
    name: Lint e Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar TypeScript
        run: npx tsc --noEmit

  # Job 2: Testes
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

  # Job 3: Build
  build:
    name: Build da Aplicação
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}

      - name: Build do Next.js
        run: npm run build
        env:
          # Variáveis com fallback para garantir que build sempre passe
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'fallback-secret-for-ci-build-only-not-secure' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://powerrun.com' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'powerrun' }}
          NEXT_PUBLIC_COMPANY_WHATSAPP: ${{ secrets.NEXT_PUBLIC_COMPANY_WHATSAPP || '5511999999999' }}
          NEXT_PUBLIC_COMPANY_EMAIL: ${{ secrets.NEXT_PUBLIC_COMPANY_EMAIL || 'contato@powerrun.com' }}
          NEXT_PUBLIC_COMPANY_PHONE: ${{ secrets.NEXT_PUBLIC_COMPANY_PHONE || '+55 11 9999-9999' }}
          NEXT_PUBLIC_COMPANY_NAME: ${{ secrets.NEXT_PUBLIC_COMPANY_NAME || 'Power Run' }}
          NEXT_PUBLIC_COMPANY_ADDRESS: ${{ secrets.NEXT_PUBLIC_COMPANY_ADDRESS || 'São Paulo, Brasil' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: Verificar artefatos de build
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Erro: Pasta .next não foi gerada"
            exit 1
          fi
          echo "✅ Build gerado com sucesso"
          ls -la .next

      - name: Upload artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            public/
          retention-days: 7

  # Job 4: Verificação de Segurança
  security:
    name: Verificação de Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=moderate

  # Job 5: Análise de Bundle Size
  analyze:
    name: Análise de Bundle
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Build com análise
        run: ANALYZE=true npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Comentar tamanho do bundle no PR
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
